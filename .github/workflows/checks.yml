name: Checks

on: [pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    strategy:
      matrix:
        os: ['ubuntu-24.04']
        node-version: ['24.18.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: |
          npm install
      - name: Lint
        run: |
          npm run lint
      - name: Audit
        run: |
          npm audit --audit-level=moderate --production
      - name: Check for packages
        uses: samdouble/package-reputation-action@master
        with:
          language: node
      - name: Test
        run: |
          npm test
      # - name: Visual Regression Tests
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.0-37 libwoff1 libharfbuzz-icu0 \
      #       libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0 libgstreamer1.0-0 \
      #       libegl1 libopus0 libxslt1.1 libgstreamer-plugins-bad1.0-0 \
      #       libgstreamer-plugins-good1.0-0 libvpx7 libenchant-2-2 libsecret-1-0 \
      #       libhyphen0 libmanette-0.2-0
      #     npx playwright install
      #     npm run test-visual
      # - name: Upload screenshots
      #   uses: actions/upload-artifact@v4
      #   if: failure()
      #   with:
      #     name: playwright-snapshots
      #     path: test-results
      - name: Build
        run: |
          npm run build
